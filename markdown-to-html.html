<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Markdown to HTML Converter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }
  .container {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 1200px;
  }
  textarea {
    width: 50%;
    height: 500px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    font-size: 14px;
    resize: vertical;
  }
  .preview {
    width: 50%;
    height: 500px;
    background: #fff;
    border-radius: 8px;
    padding: 15px;
    overflow: auto;
    border: 1px solid #ccc;
  }
  .buttons {
    margin-top: 15px;
    width: 100%;
    max-width: 1200px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background: #0056b3;
  }
</style>
</head>
<body>

<h1>Advanced Markdown to HTML Converter</h1>

<div class="container">
  <textarea id="markdown" placeholder="Write your Markdown here..."></textarea>
  <div class="preview" id="preview"></div>
</div>

<div class="buttons">
  <button onclick="copyHTML()">Copy HTML</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script>
  // Enable all languages for highlight.js
  hljs.configure({languages: ['javascript','css','php','python','html','json']});

  const markdownInput = document.getElementById('markdown');
  const previewDiv = document.getElementById('preview');

  function renderMarkdown() {
    const mdText = markdownInput.value;
    // Convert markdown to HTML
    const html = marked.parse(mdText);
    previewDiv.innerHTML = html;
    // Highlight code blocks
    document.querySelectorAll('#preview pre code').forEach(block => {
      hljs.highlightElement(block);
    });
  }

  markdownInput.addEventListener('input', renderMarkdown);

  function copyHTML() {
    const htmlContent = previewDiv.innerHTML;
    navigator.clipboard.writeText(htmlContent).then(() => {
      alert('HTML copied to clipboard!');
    }).catch(err => alert('Failed to copy HTML: '+err));
  }

  // Initial render
  renderMarkdown();
</script>
</body>
</html>
