<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body{font-family:Arial;background:linear-gradient(135deg,#1d2b64,#f8cdda);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .calculator{background:rgba(255,255,255,0.15);backdrop-filter:blur(15px);border-radius:16px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.3);width:300px}
    input{width:100%;height:50px;font-size:20px;text-align:right;border:none;border-radius:8px;padding:10px;margin-bottom:15px}
    .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    button{padding:15px;font-size:18px;border:none;border-radius:8px;cursor:pointer;background:#007bff;color:#fff;transition:0.3s}
    button:hover{background:#0056b3}
    .clear{background:#ff416c}.clear:hover{background:#e63950}
    .equal{background:#00c6ff;grid-column:span 2}.equal:hover{background:#0096c7}
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button onclick="clearDisplay()" class="clear">C</button>
      <button onclick="appendValue('/')">/</button>
      <button onclick="appendValue('*')">*</button>
      <button onclick="appendValue('-')">-</button>
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('+')">+</button>
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="calculate()" class="equal">=</button>
      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
    </div>
  </div>
  <script>
    const display=document.getElementById('display');
    function appendValue(v){display.value+=v;}
    function clearDisplay(){display.value='';}
    function calculate(){try{display.value=eval(display.value);}catch{display.value='Error';}}
  </script>
</body>
</html>
