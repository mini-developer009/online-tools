<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Base64 Encoder/Decoder</title>
  <style>
    body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.15);width:500px}
    textarea{width:100%;height:120px;margin:10px 0;padding:10px;border:1px solid #ccc;border-radius:6px;resize:vertical;font-family:monospace}
    button{margin:5px;padding:10px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
    .encode{background:#4caf50;color:#fff}
    .decode{background:#2196f3;color:#fff}
    .clear{background:#f44336;color:#fff}
  </style>
</head>
<body>
  <div class="box">
    <h2>Base64 Encoder / Decoder</h2>
    <textarea id="input" placeholder="Enter text or Base64..."></textarea>
    <div>
      <button class="encode" onclick="encodeText()">Encode</button>
      <button class="decode" onclick="decodeText()">Decode</button>
      <button class="clear" onclick="document.getElementById('input').value=''">Clear</button>
    </div>
    <textarea id="output" placeholder="Result..." readonly></textarea>
  </div>
<script>
function encodeText(){
  const txt=document.getElementById("input").value;
  document.getElementById("output").value = btoa(unescape(encodeURIComponent(txt)));
}
function decodeText(){
  try{
    const txt=document.getElementById("input").value;
    document.getElementById("output").value = decodeURIComponent(escape(atob(txt)));
  }catch(e){
    document.getElementById("output").value="Invalid Base64 input!";
  }
}
</script>
</body>
</html>
