<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Password Generator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Segoe UI,Arial;background:linear-gradient(135deg,#f5af19,#f12711);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#222}
  .card{background:#fff;padding:18px;border-radius:12px;max-width:520px;width:100%}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  input[type=range]{width:160px}
  input[type=text]{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd}
  button{padding:8px 12px;border-radius:8px;border:none;background:#f12711;color:#fff;cursor:pointer}
  label{font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="index.html" style="text-decoration:none;color:#222">&larr; Tools Home</a>
      <h2>Password Generator</h2>
    </div>

    <div class="row">
      <label>Length: <span id="lenVal">12</span></label>
      <input id="len" type="range" min="6" max="32" value="12">
    </div>

    <div class="row">
      <label><input id="lower" type="checkbox" checked> a-z</label>
      <label><input id="upper" type="checkbox" checked> A-Z</label>
      <label><input id="num" type="checkbox" checked> 0-9</label>
      <label><input id="sym" type="checkbox" checked> symbols</label>
    </div>

    <div class="row" style="margin-top:10px">
      <input id="out" type="text" readonly placeholder="Generated password">
      <button id="gen">Generate</button>
      <button id="copy">Copy</button>
    </div>
  </div>

<script>
  const len = document.getElementById('len'), lenVal = document.getElementById('lenVal');
  len.addEventListener('input', ()=> lenVal.textContent = len.value);
  function generate(){
    const l = parseInt(len.value);
    const useLower = document.getElementById('lower').checked;
    const useUpper = document.getElementById('upper').checked;
    const useNum = document.getElementById('num').checked;
    const useSym = document.getElementById('sym').checked;
    let pool = '';
    if(useLower) pool += 'abcdefghijklmnopqrstuvwxyz';
    if(useUpper) pool += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if(useNum) pool += '0123456789';
    if(useSym) pool += '!@#$%^&*()-_=+[]{}|;:,.<>?';
    if(!pool) { alert('Select at least one character set'); return; }
    let pw = '';
    for(let i=0;i<l;i++) pw += pool.charAt(Math.floor(Math.random()*pool.length));
    document.getElementById('out').value = pw;
  }
  document.getElementById('gen').addEventListener('click', generate);
  document.getElementById('copy').addEventListener('click', ()=> {
    const v = document.getElementById('out').value;
    if(!v) return alert('Generate a password first');
    navigator.clipboard.writeText(v).then(()=> alert('Copied to clipboard'));
  });
  // init
  generate();
</script>
</body>
</html>
