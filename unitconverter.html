<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <style>
    body{font-family:Arial;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .converter{background:#fff;padding:20px;border-radius:10px;box-shadow:0 5px 20px rgba(0,0,0,0.2);width:300px}
    select,input{width:100%;padding:10px;margin:10px 0;border-radius:6px;border:1px solid #ccc}
    button{width:100%;padding:10px;background:#007bff;color:#fff;border:none;border-radius:6px;cursor:pointer}
    button:hover{background:#0056b3}
    h2{text-align:center}
  </style>
</head>
<body>
  <div class="converter">
    <h2>Unit Converter</h2>
    <input type="number" id="value" placeholder="Enter value">
    <select id="type">
      <option value="km-miles">Km → Miles</option>
      <option value="miles-km">Miles → Km</option>
      <option value="kg-lb">Kg → Pounds</option>
      <option value="lb-kg">Pounds → Kg</option>
    </select>
    <button onclick="convert()">Convert</button>
    <h3 id="result"></h3>
  </div>
  <script>
    function convert(){
      let val=parseFloat(document.getElementById('value').value);
      let type=document.getElementById('type').value;
      let res="";
      switch(type){
        case "km-miles":res=(val*0.621371).toFixed(2)+" miles";break;
        case "miles-km":res=(val/0.621371).toFixed(2)+" km";break;
        case "kg-lb":res=(val*2.20462).toFixed(2)+" lb";break;
        case "lb-kg":res=(val/2.20462).toFixed(2)+" kg";break;
      }
      document.getElementById('result').innerText=res;
    }
  </script>
</body>
</html>
