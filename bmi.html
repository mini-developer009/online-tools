<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BMI Calculator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Segoe UI,Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
  .card{background:rgba(255,255,255,0.12);padding:18px;border-radius:12px;max-width:480px;width:100%}
  label{display:block;margin-top:8px}
  input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:6px}
  button{margin-top:12px;padding:10px;border-radius:8px;border:none;background:#00c6ff;color:#042;font-weight:700;cursor:pointer}
  .result{margin-top:12px;padding:10px;border-radius:8px;background:rgba(255,255,255,0.06);color:#fff}
</style>
</head>
<body>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <a href="index.html" style="color:#fff;text-decoration:none">&larr; Tools Home</a>
      <h2>BMI Calculator</h2>
    </div>

    <label>Weight (kg)</label>
    <input id="weight" type="number" placeholder="e.g. 70">

    <label>Height (cm)</label>
    <input id="height" type="number" placeholder="e.g. 175">

    <button onclick="calc()">Calculate BMI</button>

    <div class="result" id="res" style="display:none"></div>
  </div>

<script>
  function calc(){
    const w = parseFloat(document.getElementById('weight').value);
    const h = parseFloat(document.getElementById('height').value);
    if(!w || !h){ alert('Enter weight and height'); return; }
    const m = h/100;
    const bmi = +(w/(m*m)).toFixed(1);
    let cat = '';
    if(bmi < 18.5) cat = 'Underweight';
    else if(bmi < 25) cat = 'Normal';
    else if(bmi < 30) cat = 'Overweight';
    else cat = 'Obese';
    const out = `BMI: ${bmi} — ${cat}`;
    const el = document.getElementById('res'); el.style.display='block'; el.textContent=out;
  }
</script>
</body>
</html>
